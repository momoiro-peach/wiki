<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>2026년 크아 가족 미국 서부 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 정돈된 여행 노트: 중립 회색 바탕, 차분한 파란색 하나, 얇은 선과 충분한 여백. */
:root{
  --bg:#f5f7fa; --card:#fff; --ink:#2b3542; --mute:#5f6b79; --line:#e2e7ee;
  --accent:#2f5d8a; --accent-soft:#e8eff6;
  --teal:#23786a; --teal-soft:#e2f1ee; --amber:#8a5a00; --amber-soft:#fbf1da; --rose:#b4475a; --hot:#c2571a; --cold:#2f6fb0; --sun:#f0a81c; --cloud:#a9bacb; --rain:#4a86c5; --bolt:#f4b400;
  --ok:#2f5d8a; --bk:#23786a; --opt:#8a5a00; --est:#7b8693;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px; --nav:112px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#12161c; --card:#1a2029; --ink:#e6eaf0; --mute:#a2adbb; --line:#2a323e;
  --accent:#8db6e0; --accent-soft:#222c3a; --teal:#7cc2b6; --teal-soft:#1d2d2b; --amber:#e0b665; --amber-soft:#2f2a1b; --rose:#e58a9a; --hot:#ffab7a; --cold:#8db6e0; --sun:#ffc94d; --cloud:#7f92a7; --rain:#78aef0; --bolt:#ffd54a; --ok:#8db6e0; --bk:#7cc2b6; --opt:#e0b665; --est:#8a94a1}}
*{box-sizing:border-box}
html{scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom))}

.top{padding:22px 0 14px;border-bottom:1px solid var(--line)}
.top .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top .sub{font-size:.85rem;color:var(--mute)}
.top h1{margin:2px 0 0;font:500 1.4rem/1.35 var(--font);letter-spacing:-.01em;color:var(--accent)}
.dd{font-size:.85rem;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 10px;white-space:nowrap}

h2.sec{margin:28px 0 8px;font:700 1rem var(--font);color:var(--accent);padding-left:10px;border-left:3px solid var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
.card.pad{padding:14px 16px}
dl.kv{margin:0}
dl.kv div{display:grid;grid-template-columns:5.2rem 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
dl.kv div:last-child{border:0}
dl.kv dt{color:var(--accent);font-size:.9rem;font-weight:500}
dl.kv dd{margin:0;word-break:break-word}

/* 한눈에 목록 */
.rows{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rows li+li{border-top:1px solid var(--line)}
.rows button{display:grid;grid-template-columns:3.4rem 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 16px;cursor:pointer}
.rows button:hover{background:var(--accent-soft)}
.rows .n{font-weight:700;color:var(--accent)}
.rows .t{font-weight:500;line-height:1.45}
.rows .s{font-size:.85rem;color:var(--mute)}
.rows .d{font-size:.85rem;color:var(--mute);text-align:right;white-space:nowrap}

/* 일차 선택 */
.chips{position:sticky;top:0;z-index:8;background:var(--bg);margin:0 -16px;padding:10px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;cursor:pointer;line-height:1.3;text-align:center;font-size:.9rem}
.chips button span{display:block;font-size:.72rem;color:var(--mute)}
.chips button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips button[aria-selected=true] span{color:rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chips button[aria-selected=true]{color:#10202e}:root:not([data-theme=light]) .chips button[aria-selected=true] span{color:rgba(16,32,46,.75)}}

.dayhead{padding:22px 0 6px}
.dayhead .dn{font-size:.85rem;color:var(--accent);font-weight:700}
.dayhead h2{margin:2px 0 0;font:500 1.4rem/1.35 var(--font);letter-spacing:-.01em}
.dayhead p{margin:2px 0 0;color:var(--mute);font-size:.92rem}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.85rem;color:var(--mute)}
.prog i{flex:1;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--accent);transition:width .25s}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.8rem;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c);border:2px solid var(--c)}
.legend .l-est::before{background:transparent;border-style:dashed}

/* 타임라인 */
.route{list-style:none;margin:20px 0 0;padding:0}
.stop{display:grid;grid-template-columns:3.6rem 20px 1fr;gap:0 10px}
.stop time{text-align:right;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.5;padding-top:1px}
.stop time small{display:block;font-weight:400;font-size:.72rem;color:var(--mute)}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:20px;bottom:-4px;border-left:1px solid var(--line);transform:translateX(-50%)}
.rail button{position:relative;margin:4px 0 0 1px;width:18px;height:18px;border-radius:50%;border:2px solid var(--c);background:var(--bg);cursor:pointer;padding:0;display:grid;place-items:center;color:#fff;font-size:.62rem;line-height:1}
.stop.est .rail button{border-style:dashed}
.stop.ok{--c:var(--ok)}.stop.bk{--c:var(--bk)}.stop.opt{--c:var(--opt)}.stop.est{--c:var(--est)}
.stop.done .rail button{background:var(--c);border-style:solid}
.stop.done .rail button::after{content:"✓"}
.stop:last-child .rail::before{display:none}
.body{padding-bottom:26px;min-width:0}
.body h4{margin:0;font-size:1.02rem;font-weight:500;line-height:1.5}
.stop.done .body h4{color:var(--mute);text-decoration:line-through}
.badge{display:inline-block;margin-left:8px;vertical-align:1px;font-weight:500;font-size:.72rem;line-height:1;padding:3px 7px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.body p{margin:3px 0 0;color:var(--mute);font-size:.94rem;line-height:1.65}
ul.notes{margin:8px 0 0;padding:10px 14px 10px 30px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 28%,transparent);border-left:4px solid var(--amber);border-radius:var(--r);font-size:.92rem;line-height:1.6}
ul.notes li+li{margin-top:4px}
.place{margin-top:10px;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.place .nm{font-weight:500;font-size:.98rem;line-height:1.4;color:var(--accent)}
.ad{font-size:.8rem;color:var(--mute);line-height:1.45;margin-top:1px}
.links{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.links a{font-size:.82rem;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--accent);background:var(--card)}
.links a.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .links a.go{color:#10202e}}
.mini{height:120px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.mini iframe{width:100%;height:100%;border:0;display:block}

/* 장소 / 영어 */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:11px 14px;font:inherit;color:var(--ink);margin:12px 0 10px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.fchips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .fchips button[aria-pressed=true]{color:#10202e}}
.list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.list .card{padding:12px 16px}
.ph{display:flex;gap:12px;align-items:center;justify-content:space-between}
.lb{display:inline-block;font-size:.72rem;font-weight:500;line-height:1;padding:3px 7px;border-radius:5px;margin-right:7px;vertical-align:2px}
.lb.qq{background:var(--accent-soft);color:var(--accent)}
.lb.aa{background:var(--teal-soft);color:var(--teal)}
.ph .q{font-size:.9rem;color:var(--accent);line-height:1.55;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.ph .q .qk{color:var(--mute);font-size:.85rem}
.note{margin:0 0 6px;padding:10px 14px;background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:var(--r);font-size:.92rem;line-height:1.6}
.ph .t{font-weight:500;font-size:1.08rem;line-height:1.5;color:var(--teal)}.ph .k{color:var(--mute);font-size:.88rem}
.ph .sayb{flex:none;border:1px solid color-mix(in srgb,var(--teal) 40%,transparent);background:var(--teal-soft);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem;color:var(--teal)}
dialog{border:0;border-radius:14px;max-width:min(560px,92vw);width:100%;padding:28px 22px;background:var(--card);color:var(--ink);text-align:center}
dialog::backdrop{background:rgba(20,28,40,.5)}
dialog .big{font:700 clamp(1.45rem,6vw,2rem)/1.4 var(--font);margin:4px 0 10px}
dialog .row{display:flex;gap:8px;justify-content:center;margin-top:18px}
dialog .row button{border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--card)}
dialog .row #dsay{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) dialog .row #dsay{color:#10202e}}

/* 준비 */
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:14px 0 10px;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:8px 4px;cursor:pointer;color:var(--mute);font-size:.92rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected=true]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border:0}
.chk input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.chk.done span{color:var(--mute);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:500;font-size:.8rem}
tr:last-child td{border:0}
.mt{margin-top:12px}
.foot{margin:28px 0 0;color:var(--mute);font-size:.82rem}

/* 날씨 */
.wxwrap{display:grid;gap:10px;margin-top:14px}
.wx{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.wxhead{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--mute)}
.wxloc{font-weight:500;color:var(--accent)}
.wxmain{display:flex;gap:12px;align-items:center;margin-top:6px}
.wxicon svg{width:54px;height:54px;display:block}
.wxtemp{display:flex;flex-direction:column;line-height:1.15;min-width:4.2rem}
.wxtemp .hi{font-size:1.7rem;font-weight:700;color:var(--hot)}
.wxtemp .lo{font-size:1.2rem;font-weight:500;color:var(--cold)}
.wxtemp small{font-size:.68rem;color:var(--mute)}
.wxdesc{flex:1;min-width:0;font-size:.86rem;color:var(--mute);display:flex;flex-direction:column;gap:1px;line-height:1.5}
.wxdesc b{color:var(--ink);font-size:1rem;font-weight:500}
.wxhaz{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:.88rem;line-height:1.5;border:1px solid;border-left-width:5px}
.wxhaz.danger{background:color-mix(in srgb,var(--rose) 14%,transparent);border-color:var(--rose);color:var(--rose);font-weight:500}
.wxhaz.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.wxfoot{margin-top:8px;font-size:.75rem;color:var(--mute)}
.wxnorm{font-size:.9rem;color:var(--mute);margin-top:6px;line-height:1.6}
.wxnorm b{color:var(--ink);font-weight:500}
.w-sun{fill:var(--sun);stroke:var(--sun)}.w-cloud{fill:var(--cloud)}.w-rain{stroke:var(--rain);fill:none;stroke-width:3;stroke-linecap:round}.w-snow{fill:var(--rain)}.w-bolt{fill:var(--bolt)}.w-dark{fill:#8798ab}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
nav.bar .in{display:flex;max-width:720px;margin:0 auto}
.nextbar{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding:7px 12px;font-size:.88rem;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}
.nextbar[hidden]{display:none}
.nextbar .lbn{flex:none;font-size:.72rem;font-weight:500;line-height:1;padding:4px 8px;border-radius:5px;background:var(--accent);color:#fff}
.nextbar .tm{flex:none;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.nextbar .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .nextbar .lbn{color:#10202e}}
.nextcard{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-left:5px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-top:18px}
.nextcard .lbn{font-size:.8rem;font-weight:700;color:var(--accent)}
.nextcard .when{font-size:.85rem;color:var(--mute);margin-top:2px}
.nextcard .big{display:flex;gap:12px;align-items:baseline;margin-top:6px}
.nextcard .big b{font-size:1.6rem;line-height:1.2;color:var(--accent);font-variant-numeric:tabular-nums}
.nextcard .big span{font-size:1.15rem;font-weight:500;line-height:1.4}
.nextcard p{margin:6px 0 0;font-size:.94rem;color:var(--mute)}
.nextcard .nm{margin-top:10px;font-weight:500;color:var(--accent)}
.nextcard .go2{margin-top:10px;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.stop.next .rail button{box-shadow:0 0 0 4px var(--accent-soft)}
.stop.next .body h4{color:var(--accent);font-weight:700}
.badge.nx{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .badge.nx{color:#10202e}}
nav.bar button{flex:1;border:0;background:none;cursor:pointer;padding:6px 0 4px;color:var(--mute);font-size:.72rem;line-height:1.3}
nav.bar svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bar button[aria-current=page]{color:var(--accent);font-weight:700}
@media (max-width:480px){.stop{grid-template-columns:3.1rem 18px 1fr;gap:0 8px}.rows button{grid-template-columns:3rem 1fr}.rows .d{display:none}dl.kv div{grid-template-columns:4.6rem 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="row"><span class="sub">2026.11.12 ~ 11.24 · 라스베이거스, 로스앤젤레스</span><span class="dd" id="dd"></span></div><h1>2026년 크아 가족 미국 서부 여행</h1></header>
  <main id="view"></main>
  <p class="foot">가족 공유용 일정표입니다. 예약번호 같은 개인 정보는 뺐습니다. 점선 동그라미는 아직 정해지지 않은 예상 시각입니다. 날씨는 Open-Meteo 예보와 미국 기상청(NWS) 경보를 사용합니다.</p>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
<symbol id="i-id" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.6 5.4-1.6 6 0M14 10h4M14 13h4"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="13" rx="2"/><path d="M9 8V5a3 3 0 0 1 6 0v3"/></symbol>
</defs></svg>
<nav class="bar" aria-label="주 메뉴"><div class="nextbar" id="nextbar" hidden></div><div class="in" id="nav">
  <button data-v="home"><svg><use href="#i-home"/></svg>한눈에</button>
  <button data-v="plan"><svg><use href="#i-cal"/></svg>일정</button>
  <button data-v="places"><svg><use href="#i-pin"/></svg>장소</button>
  <button data-v="phrase"><svg><use href="#i-id"/></svg>입국 심사</button>
  <button data-v="ready"><svg><use href="#i-bag"/></svg>준비</button>
</div></nav>

<dialog id="dlg" aria-label="영어 문장 크게 보기"><div class="big" id="dbig"></div><div id="dko" style="color:var(--mute)"></div>
  <div class="row"><button id="dsay">소리 듣기</button><button id="dcopy">복사</button><button id="dclose">닫기</button></div></dialog>

<script>
// 장소: Google Maps에 표시되는 이름과 주소(2026-11-02 구글 지도에서 확인). 이름+주소로 길 안내.
const PL={
 "Gimhae International Airport":["Gimhae International Airport","108 Gonghangjinip-ro, Gangseo-gu, Busan, South Korea"],
 "Incheon International Airport Terminal 2":["Incheon International Airport Terminal 2","제2터미널대로 446, Jung-gu, Incheon, South Korea"],
 "Harry Reid International Airport Terminal 3":["Harry Reid International Airport (LAS) Terminal 3","5757 Wayne Newton Blvd, Las Vegas, NV 89119"],
 "Hertz Harry Reid International Airport Las Vegas 7135 Gilespie St":["Hertz Car Rental - Las Vegas - Harry Reid International Airport (LAS)","7135 Gilespie St, Las Vegas, NV 89119"],
 "Elara Hilton Grand Vacations 80 E Harmon Ave Las Vegas":["Hilton Grand Vacations Club Elara Center Strip Las Vegas","80 E Harmon Ave, Las Vegas, NV 89109"],
 "The Buffet at Wynn Las Vegas":["The Buffet at Wynn Las Vegas","3131 S Las Vegas Blvd, Las Vegas, NV 89109"],
 "M&M's World Las Vegas":["M&M’S Las Vegas","3785 S Las Vegas Blvd, Las Vegas, NV 89109"],
 "Fountains of Bellagio":["Fountains of Bellagio","3600 S Las Vegas Blvd, Las Vegas, NV 89109"],
 "Las Vegas North Premium Outlets":["Las Vegas North Premium Outlets","875 S Grand Central Pkwy, Las Vegas, NV 89106"],
 "Sphere Las Vegas 255 Sands Ave":["Sphere","255 Sands Ave, Las Vegas, NV 89169"],
 "Grand Canyon West Skywalk":["Grand Canyon West Skywalk","808 Eagle Point Rd, Peach Springs, AZ 86434"],
 "Residence Inn by Marriott Los Angeles Glendale":["Residence Inn by Marriott Los Angeles Glendale","199 N Louise St, Glendale, CA 91206"],
 "The Americana at Brand":["The Americana at Brand","889 Americana Way, Glendale, CA 91210"],

function wxIcon(c){

  const cloud=(dx,dy,cls)=>`<g transform="translate(${dx} ${dy})" class="${cls||""}"><circle class="${cls||"w-cloud"}" cx="17" cy="27" r="7"/><circle class="${cls||"w-cloud"}" cx="26" cy="22" r="9"/><circle class="${cls||"w-cloud"}" cx="35" cy="27" r="6"/><rect class="${cls||"w-cloud"}" x="17" y="27" width="18" height="6"/></g>`;

  let g;
  if(c===0) g=sun(24,24,9);

  else if(c===2) g=sun(17,17,7)+cloud(4,6);
  else if(c===3) g=cloud(0,2);

function wxHazards(c,ps,g,lo,hi){

async function loadWx(){
  const now=Date.now();
  await Promise.all(Object.keys(LOC).map(async k=>{
    const L=LOC[k], ck="wx_"+k, c=store.get(ck,null);
    if(c&&now-c.t<3*3600e3){WXD[k]=c.d;WXT[k]=c.t}
    else{
      try{
        const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max,sunrise,sunset&timezone=auto&forecast_days=16`);
        if(!r.ok)throw 0; const j=await r.json(); WXD[k]=j.daily; WXT[k]=now; store.set(ck,{t:now,d:j.daily});
      }catch(e){ if(c){WXD[k]=c.d;WXT[k]=c.t}else WXD[k]=false }
    }
    wxRefresh();
    try{
      const r=await fetch(`https://api.weather.gov/alerts/active?point=${L.lat.toFixed(4)},${L.lon.toFixed(4)}`);
      if(r.ok){const j=await r.json();WXA[k]=(j.features||[]).map(f=>({event:f.properties.event,headline:f.properties.headline,start:f.properties.onset||f.properties.effective,end:f.properties.ends||f.properties.expires}))}
    }catch(e){}
  }));

}

  const q=state.q.trim().toLowerCase();
  const rows=all.filter(p=>(state.cat==="전체"||p.cat===state.cat)&&(!q||(p.name+p.addr).toLowerCase().includes(q)));
  return `<h2 class="sec" style="margin-top:20px">가는 곳 ${all.length}곳</h2>
  <input class="search" id="q" type="search" placeholder="장소 이름 검색" value="${esc(state.q)}" aria-label="장소 검색">
  <div class="fchips">${cats.map(c=>`<button data-c="${c}" aria-pressed="${state.cat===c}">${c}</button>`).join("")}</div>
  <ul class="list">${rows.map(p=>`<li class="card"><div style="font-weight:700;line-height:1.45">${esc(p.name)}</div><div class="ad">${esc(p.addr)}</div><div class="ad">${p.day+1}일차 · ${days[p.day].d} · ${p.cat}</div><div class="links"><a class="go" href="${nav(p.q)}" target="_blank" rel="noopener">길 안내</a><a href="${gmap(p.q)}" target="_blank" rel="noopener">구글 지도</a><a href="${amap(p.q)}" target="_blank" rel="noopener">애플 지도</a></div></li>`).join("")||`<li class="card pad">찾는 장소가 없어요.</li>`}</ul>`;
}
let PH=[];
function phrase(){
  PH=[];
  return `<h2 class="sec" style="margin-top:20px">입국 심사 가이드</h2><p style="margin:0 0 4px;color:var(--mute);font-size:.92rem">아주 쉬운 영어로 짧게 답해요. 답을 누르면 크게 보이고, 소리 버튼으로 읽어 줘요.</p>`+
  phrases.map(([cat,items,note,ql])=>`<h2 class="sec">${cat}</h2>${note?`<p class="note">${esc(note)}</p>`:""}<ul class="list">${items.map(([en,ko,qe,qk])=>{PH.push([en,ko]);const n=PH.length-1;return `<li class="card"><div class="ph"><div data-big="${n}" style="cursor:pointer">${qe?`<div class="q"><span class="lb qq">${ql||"질문"}</span>${esc(qe)}<br><span class="qk">${esc(qk)}</span></div>`:""}<div class="t"><span class="lb aa">${qe?"답":"말하기"}</span>${esc(en)}</div><div class="k">${esc(ko)}</div></div><button class="sayb" data-say="${n}" aria-label="소리 듣기">소리</button></div></li>`}).join("")}</ul>`).join("");
}
function ready(){
  const seg=`<div class="seg" role="tablist"><button role="tab" data-r="todo" aria-selected="${state.ready==="todo"}">해야 할 일</button><button role="tab" data-r="pack" aria-selected="${state.ready==="pack"}">짐 챙기기</button><button role="tab" data-r="book" aria-selected="${state.ready==="book"}">예약 정보</button></div>`;
  if(state.ready==="book")return seg+`<div class="card pad"><h2 class="sec" style="margin:0 0 6px">항공</h2><table><tr><th>날짜</th><th>편명</th><th>구간</th><th>좌석</th></tr>${flights.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td></tr>`).join("")}</table></div>`+
    books.map(b=>`<div class="card pad mt"><h2 class="sec" style="margin:0 0 4px">${esc(b[0])}</h2><dl class="kv">${b[1].map(r=>`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl></div>`).join("");
  if(state.ready==="pack"){
    const n=packing.filter((_,i)=>pdone[i]).length;
    return seg+`<div class="prog"><span>${n}/${packing.length} 챙김</span><i><b style="width:${n/packing.length*100}%"></b></i></div><div class="card mt">${packing.map((t,i)=>{const on=!!pdone[i];return `<label class="chk ${on?"done":""}"><input type="checkbox" data-pack="${i}" ${on?"checked":""}><span>${esc(t)}</span></label>`}).join("")}</div>`;
  }
  const all=todos.map((t,i)=>[t,i]);
  const open=all.filter(([t,i])=>!(tdone[i]??t[1])), fin=all.filter(([t,i])=>tdone[i]??t[1]);
  const row=([t,i])=>{const on=tdone[i]??t[1];return `<label class="chk ${on?"done":""}"><input type="checkbox" data-todo="${i}" ${on?"checked":""}><span>${esc(t[0])}</span></label>`};
  return seg+`<h2 class="sec" style="margin-top:12px">남은 일 ${open.length}개</h2><div class="card">${open.map(row).join("")||"<p>모두 끝났어요.</p>"}</div><h2 class="sec">끝낸 일 ${fin.length}개</h2><div class="card">${fin.map(row).join("")}</div>`;
}

// ---- 렌더
function render(push=true){
  $$("#nav button").forEach(b=>{if(b.dataset.v===state.v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const v=$("#view");
  v.innerHTML={home,plan,places,phrase,ready}[state.v]();
  $$(".mini",v).forEach(m=>{const f=document.createElement("iframe");f.loading="lazy";f.referrerPolicy="no-referrer-when-downgrade";f.title=m.getAttribute("aria-label");f.src=embed(m.dataset.q);m.appendChild(f)});
  renderNextBar();
  if(state.focus&&state.v==="plan"){const el=$(".stop.next");if(el)el.scrollIntoView({block:"center"});state.focus=false}
  if(push){try{history.replaceState(null,"",state.v==="plan"?`#day${state.day+1}`:`#${state.v}`)}catch(e){}}
}
function go(v,scroll=true){state.v=v;render();if(scroll)window.scrollTo({top:0})}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)});
$("#nextbar").addEventListener("click",()=>{const n=nextStop();if(n){state.day=n.d;state.focus=true;go("plan",false)}});
$("#view").addEventListener("click",e=>{
  const t=e.target, c=n=>t.closest(n);
  if(c("[data-next]")){const n=nextStop();if(n){state.day=n.d;state.focus=true;go("plan",false)}}
  else if(c("[data-day]")){state.day=+c("[data-day]").dataset.day;go("plan")}
  else if(c("[data-d]")){state.day=+c("[data-d]").dataset.d;render();window.scrollTo({top:0})}
  else if(c("[data-k]")){const k=c("[data-k]").dataset.k;done[k]=!done[k];store.set("done",done);const y=scrollY;render(false);scrollTo({top:y})}
  else if(c("[data-c]")){state.cat=c("[data-c]").dataset.c;render(false)}
  else if(c("[data-r]")){state.ready=c("[data-r]").dataset.r;render(false)}
  else if(c("[data-say]"))say(PH[+c("[data-say]").dataset.say][0]);
  else if(c("[data-big]"))openBig(+c("[data-big]").dataset.big);
});
$("#view").addEventListener("input",e=>{if(e.target.id==="q"){state.q=e.target.value;const pos=e.target.selectionStart;render(false);const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}});
$("#view").addEventListener("change",e=>{
  const el=e.target;if(!el.matches("input[type=checkbox]"))return;
  if(el.dataset.todo!==undefined){tdone[el.dataset.todo]=el.checked;store.set("todo",tdone)}
  if(el.dataset.pack!==undefined){pdone[el.dataset.pack]=el.checked;store.set("pack",pdone)}
  const y=scrollY;render(false);scrollTo({top:y});
});

// ---- 영어: 소리, 크게 보기
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let cur=0;
function openBig(n){cur=n;$("#dbig").textContent=PH[n][0];$("#dko").textContent=PH[n][1];$("#dlg").showModal()}
$("#dsay").onclick=()=>say(PH[cur][0]);
$("#dcopy").onclick=async()=>{try{await navigator.clipboard.writeText(PH[cur][0]);$("#dcopy").textContent="복사했어요"}catch(e){$("#dcopy").textContent="복사할 수 없어요"}setTimeout(()=>$("#dcopy").textContent="복사",1500)};
$("#dclose").onclick=()=>$("#dlg").close();

// ---- 시작: 해시, 여행 중이면 오늘 일정
const h=location.hash.slice(1), m=h.match(/^day(\d+)$/);
if(m&&days[+m[1]-1]){state.day=+m[1]-1;state.v="plan"}
else if(["home","plan","places","phrase","ready"].includes(h))state.v=h;
else if(tripIdx>=0){state.v="plan";const n=nextStop();if(n){state.day=n.d;state.focus=true}}
render(false);
loadWx();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadWx()});
</script>
</body>
</html>
